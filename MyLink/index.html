<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLink | 최기원</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, #fdf6ec 0%, #e8f3ef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
      color: #2b2b2b;
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: #2f7d62; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin: 0 auto 16px;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .bio { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 28px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .links a {
      display: block; padding: 15px 18px;
      background: #fff; border: 1.5px solid #2f7d62; border-radius: 14px;
      color: #2f7d62; text-decoration: none; font-weight: 600; font-size: 15px;
      transition: all 0.2s;
    }
    .links a:hover { background: #2f7d62; color: #fff; transform: translateY(-2px); }
    footer { margin-top: 32px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">🌱</div>
    <h1> 최기원</h1>
    <p class="bio">
      광운대학교 경영학 · 사회복지학 연계전공<br>
      NGO·재단 모금과 사회공헌을 준비하고 있습니다
    </p>

    <nav class="links">
      <a href="https://github.com/kxwonn" target="_blank">💻 GitHub</a>
      <a href="https://www.instagram.com/" target="_blank">📷 Instagram</a>
      <a href="https://blog.naver.com/" target="_blank">✍️ 블로그</a>
      <a href="https://www.linkedin.com/" target="_blank">💼 LinkedIn</a>
      <a href="mailto:rldnjs4123@gmail.com">✉️ 이메일 보내기</a>
    </nav>

    <footer>© 2026 MyLink</footer>
  </main>
</body>
</html>
